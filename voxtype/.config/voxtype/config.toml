# ┏━━━━━━━━┓
# ┃ config ┃
# ┗━━━━━━━━┛

engine = "parakeet"

[hotkey]
enabled = false

[parakeet]
model = "parakeet-tdt-0.6b-v3-int8"

[output]
mode = "type"

[output.notification]
on_transcription = false

[text.replacements]
# general
"hyper land" = "Hyprland"
"neo vim" = "Neovim"
"dot files" = "dotfiles"
# javascript / typescript
"java script" = "JavaScript"
"type script" = "TypeScript"
"node js" = "Node.js"
"next js" = "Next.js"
"es lint" = "ESLint"
"ts config" = "tsconfig"
"package dot json" = "package.json"
"dot env" = ".env"
"use effect" = "useEffect"
"jason" = "JSON"
# claude
"clod" = "Claude"
"clawed" = "Claude"
"cloud code" = "Claude Code"
"claude code" = "Claude Code"
"claude dot md" = "CLAUDE.md"
"and tropic" = "Anthropic"
"sub agent" = "subagent"
# dotfiles tools
