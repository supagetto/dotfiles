# Show the built-in speaker as "Default Speaker" in apps.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        node.description = "Default Speaker"
      }
    }
  }
]
